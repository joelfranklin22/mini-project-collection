<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>QUIZ TIME</title>

    <script>
        function store() {
            localStorage.setItem("question-4", document.querySelector("input[name='quest-4']:checked").value);
        }
    </script>
    <script>
        // Your JavaScript logic here
        let sec = 15;
        let interval;

        function startTimer() {
            interval = setInterval(function () {
                document.getElementById('timer').innerHTML = sec + ' Sec Left';
                sec--;
                if (sec === 0) {
                    clearInterval(interval);
                    location.replace("q5.html");
                }
            }, 1000);
        }

        document.getElementById('start').addEventListener('click', startTimer);
    </script>
</head>

<body onload="startTimer()">
    <div class="container">

        <div class="header">
            <h1>Quiz Time</h1>
            <div class="end-1">4 Out Of 5</div>
            <div class="front-end" id="timer">15 Sec Left</div>
        </div>
        <div class="back-img"><img src="2.jpg" alt=""></div>
        <div class="question-1 q1">4.They grow much faster than bamboo. Take care, or they'll come after you.</div>
        <form class="choice" action="q5.html">
            <div class="choice-1"><input type="radio" name="quest-4" id="box-1"
                    value="Palm">&emsp;<span>A.Palm</span></input></div>
            <div class="choice-2"><input type="radio" name="quest-4" id="box-2"
                    value="Plants">&emsp;<span>B.Plants</span></input></div>
            <div class="choice-3"><input type="radio" name="quest-4" id="box-3"
                    value="Tree">&emsp;<span>C.Tree</span></input></div>
            <div class="choice-4"><input type="radio" name="quest-4" id="box-4"
                    value="Ants">&emsp;<span>D.Ants</span></input></div>
            <div class="end-2"><input type="submit" value="Next" onclick="store()"></div>
        </form>
    </div>
</body>

</html>
